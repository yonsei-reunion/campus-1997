name: 메타모아 업데이트 소식

# 아침마다 어제(한국 시각) 새 소식의 요약을 메타모아 업데이트 소식으로
# 올린다(tools/metamoa_update.py). 어제 새 소식이 없으면 올리지 않는다.
# 메타모아는 24시간에 한 번만 받는다. 전날 실행이 밀려 24시간이 안 돼
# 거절(429)되면 스크립트가 남은 시간(두 시간 안)만큼 기다렸다 다시 올린다.
# 공간 키는 secret METAMOA_KEY. 없으면(승인 전) 건너뛴다.

on:
  schedule:
    - cron: '20 0 * * *'   # 한국 시각 09:20
  workflow_dispatch:
    inputs:
      date:
        description: '새 소식 날짜(YYYY-MM-DD). 비우면 어제'
        required: false
      text:
        description: '새 소식 대신 올릴 글(200자 · 세 줄)'
        required: false

permissions:
  contents: read

concurrency:
  group: metamoa-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/metamoa_update.py
            web/public/data/releases.json
          sparse-checkout-cone-mode: false
      - name: 업데이트 소식 올리기
        env:
          METAMOA_KEY: ${{ secrets.METAMOA_KEY }}
          METAMOA_SPACE_ID: yonsei-1997-benelog-net-mwj6vzb6
          IN_DATE: ${{ inputs.date }}
          IN_TEXT: ${{ inputs.text }}
        run: |
          args=()
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_TEXT" ] && args+=(--text "$IN_TEXT")
          python3 tools/metamoa_update.py "${args[@]}"
